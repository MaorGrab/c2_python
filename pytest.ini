[tool:pytest]
# Pytest configuration for C2 project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio configuration
asyncio_mode = auto

# Coverage options (if pytest-cov installed)
# Uncomment to enable coverage reporting
# addopts = 
#     -v
#     --cov=src
#     --cov-report=html
#     --cov-report=term-missing
#     --cov-fail-under=80

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    network: Tests requiring network

# Ignore paths
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    src/ignore
